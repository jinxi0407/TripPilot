<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc">
  <title id="title">TripPilot 多智能体交互架构</title>
  <desc id="desc">Supervisor 通过 A2A 依次委派 Transport 与 Local Travel 两个独立服务。研究结果回传并写入共享状态，Travel Planner 基于这些证据进行 ReAct 编排，Critic 校验候选行程。确认且阻断的冲突回到 Supervisor，再调度 Planner，最多重规划两次。专业 Agent 和 Planner 通过 MCP 访问七类工具，运行受 Harness 保护，并使用会话与长期偏好记忆。</desc>
  <defs>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#337565"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#497597"/></marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ad7840"/></marker>
    <style>
      text {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#26473e;}
      .heading {font-size:27px;font-weight:700;}
      .section {font-size:17px;font-weight:600;fill:#5b7069;}
      .name {font-size:22px;font-weight:650;}
      .body {font-size:18px;fill:#536a62;}
      .small {font-size:16px;fill:#6c7b74;}
      .label {font-size:16px;fill:#497597;}
      .panel {fill:#f1f4f0;stroke:#dee5dd;stroke-width:1;}
      .node {fill:#fff;stroke:#bfd2c5;stroke-width:1.5;}
      .flow {fill:none;stroke:#337565;stroke-width:2;stroke-linejoin:round;marker-end:url(#green);}
      .task {fill:none;stroke:#497597;stroke-width:2;stroke-linejoin:round;marker-end:url(#blue);}
      .replan {fill:none;stroke:#ad7840;stroke-width:2;stroke-dasharray:7 5;stroke-linejoin:round;marker-end:url(#amber);}
    </style>
  </defs>
  <rect width="1200" height="870" rx="18" fill="#fcfcf8"/>
  <text x="40" y="47" class="heading">TripPilot · 多智能体协作</text>
  <text x="40" y="76" class="small">LangGraph 编排 · A2A 专家委派 · ReAct 规划与 Critic 校验</text>
  <path d="M 780 50 H 810" class="task"/><text x="821" y="56" class="small">任务</text>
  <path d="M 892 50 H 922" class="flow"/><text x="933" y="56" class="small">结果</text>
  <path d="M 1007 50 H 1037" class="replan"/><text x="1048" y="56" class="small">重规划</text>

  <rect x="40" y="140" width="248" height="422" rx="16" class="panel"/>
  <rect x="360" y="140" width="320" height="422" rx="16" class="panel"/>
  <rect x="790" y="140" width="370" height="496" rx="16" class="panel"/>
  <text x="60" y="167" class="section">需求与调度</text>
  <text x="380" y="167" class="section">专业研究 · 两个独立 A2A 服务</text>
  <text x="812" y="167" class="section">行程编排与校验</text>

  <rect x="60" y="181" width="206" height="43" rx="9" fill="#e3ece4"/>
  <text x="163" y="208" text-anchor="middle" class="body">用户需求 · React / API</text>
  <path d="M 164 224 V 244" class="flow"/>
  <rect x="60" y="244" width="206" height="116" rx="12" class="node"/>
  <text x="78" y="278" class="name">Supervisor</text>
  <text x="78" y="309" class="body">理解需求 · 提取约束</text>
  <text x="78" y="337" class="body">分发任务 · 调度修订</text>

  <rect x="380" y="210" width="280" height="120" rx="12" class="node"/>
  <text x="400" y="246" class="name">Transport Agent</text>
  <text x="400" y="279" class="body">铁路 / 航班 · 门到门比较</text>
  <text x="400" y="307" class="small">返回交通候选与证据</text>
  <rect x="380" y="390" width="280" height="120" rx="12" class="node"/>
  <text x="400" y="426" class="name">Local Travel Agent</text>
  <text x="400" y="459" class="body">景点 / 住宿 / 天气 / 路线</text>
  <text x="400" y="487" class="small">返回本地研究与证据</text>
  <text x="380" y="542" class="small">依次执行；同城任务可跳过交通研究</text>

  <rect x="812" y="200" width="326" height="105" rx="12" class="node"/>
  <text x="834" y="235" class="name">Travel Planner</text>
  <text x="834" y="267" class="body">ReAct：Action → Observation</text>
  <text x="834" y="290" class="small">基于工具证据编排、修订每日行程</text>
  <rect x="812" y="385" width="326" height="105" rx="12" class="node"/>
  <text x="834" y="420" class="name">Critic</text>
  <text x="834" y="452" class="body">预算 · 时间 · 天气 · 交通校验</text>
  <text x="834" y="476" class="small">区分确认冲突与待验证信息</text>
  <rect x="850" y="555" width="250" height="61" rx="12" fill="#dfece2" stroke="#b4cebb"/>
  <text x="975" y="581" text-anchor="middle" font-size="20" font-weight="650">最终行程</text>
  <text x="975" y="605" text-anchor="middle" class="small">附待确认信息或未解决冲突</text>

  <path d="M 266 282 H 320 V 258 H 380" class="task"/>
  <text x="295" y="246" class="label">A2A</text>
  <path d="M 266 322 H 306 V 435 H 380" class="task"/>
  <text x="314" y="423" class="label">A2A</text>
  <path d="M 660 255 H 812" class="flow"/>
  <text x="686" y="241" class="small">交通结果</text>
  <path d="M 660 435 H 742 V 280 H 812" class="flow"/>
  <text x="683" y="461" class="small">本地结果</text>
  <text x="397" y="365" class="small">结果通过 Artifact 回传共享 State</text>
  <path d="M 975 305 V 385" class="flow"/>
  <text x="990" y="351" class="small">候选行程</text>
  <path d="M 975 490 V 555" class="flow"/>
  <text x="991" y="525" class="small">通过 / 达到修订上限</text>

  <path d="M 812 470 H 720 V 602 H 164 V 360" class="replan"/>
  <rect x="244" y="587" width="437" height="28" rx="6" fill="#fcfcf8"/>
  <text x="255" y="607" font-size="17" fill="#94622e">confirmed + blocking → 重新调度 · 最多 2 次</text>
  <path d="M 266 260 H 286 V 110 H 1180 V 230 H 1138" class="replan"/>
  <rect x="475" y="95" width="336" height="27" rx="6" fill="#fcfcf8"/>
  <text x="489" y="114" font-size="17" fill="#94622e">重规划时直接进入 Planner，复用研究结果</text>

  <rect x="40" y="660" width="1120" height="83" rx="13" fill="#eaf0f4" stroke="#cedce5"/>
  <text x="61" y="691" font-size="21" font-weight="650">MCP · 统一工具层</text>
  <text x="294" y="691" class="body">Transport / Local Travel / Planner 按权限调用</text>
  <text x="61" y="723" class="body">高铁 · 航班 · POI · 酒店 · 天气 · 距离 · 路线</text>
  <text x="711" y="723" class="small">Qwen 负责模型决策；高德 API 与 Dataset 提供工具证据</text>

  <rect x="40" y="760" width="552" height="78" rx="13" class="panel"/>
  <text x="61" y="791" font-size="20" font-weight="650">Runtime Harness · 贯穿执行过程</text>
  <text x="61" y="820" class="small">调用额度 / 超时 / 重试 / 权限 / 去重 / 校验 / 降级</text>
  <rect x="608" y="760" width="552" height="78" rx="13" class="panel"/>
  <text x="629" y="791" font-size="20" font-weight="650">Memory · 为规划提供上下文</text>
  <text x="629" y="820" class="small">Session 会话记忆 + SQLite 结构化长期旅行偏好</text>
</svg>
